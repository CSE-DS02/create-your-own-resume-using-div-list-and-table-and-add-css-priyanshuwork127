<!DOCTYPE html>
<html lang="en">
<head>
<title>Student registration form(Experiment 5)</title>
</head>
<body>
<h1>Student registration form</h1>
<fieldset>
<form action="" method="get">

<label for="name">First Name:</label>
<input id="name" type="text" placeholder="Enter your name" required> <br><br>
<label for="mname">Middle Name:</label>
<input id="mname" type="text" placeholder="Enter your middle name"> <br><br>
<label for="lname">Last Name:</label>
<input id="lname" type="text" placeholder="Enter last name"> <br><br>

<label for="mobile">Mobile no:</label>
<input id="mobile" type="tel" placeholder="Enter your mobile no" required><br><br>

<label for="email">Email no:</label>
<input id="email" type="email" placeholder="example@mail.com">
<br><br>
<label for="gender">Gender:</label>
<input type="radio" name="gender" id="gender" value="male">Male
<input type="radio" name="gender" id="gender"value="female">FEMALE
<br><br>
<label for="date">Date of birth:</label>
<input type="date" id="date" required>
<br><br>
<label for="branch">Branch:</label>
<select>
<option name="a" value="cse">CSE</option>
<option name="a" value="cse ai-ml">CSE AI-ML</option>
<option name="a" value="cse ds">CSE DS</option>
<option name="a" value="ece">ECE</option>
</select>
<br><br>
<label for="state">City:</label>
<input type="checkbox" value="delhi">Delhi
<input type="checkbox" value="mumbai">Mumbai
<br><br>

<button type="submit" style="background-color:yellow">Submit</button>
<button type="reset" style="background-color:red">Reset</button>
</form>
</fieldset>
</body>
</html>
