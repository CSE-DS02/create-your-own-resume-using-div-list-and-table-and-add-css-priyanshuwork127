<html>
    <head>
        <title>
            Hotel room booking form
        </title>
    </head>
    <body>
        <form align="center">
            <fieldset align="Center">
                <h1 align="center"><b>PRE-REGISTRATION-FORM</b></h1>
            <label for="">Full name :</label>
            <input type="text"  placeholder="Enter your name">
            <br><br>
            <label for="">Email :</label>
            <input type="email" placeholder="Enter your email">
            <br><br>
            <label for="">Phone :</label>
            <input type="tel" placeholder="Enter your mobile no" minlength="10" maxlength="10">
            <br><br>
            <br><br>
            <label for="">Products:</label>
            <select name="" id="">
                <option value="SAMSUNG">SAMSUNG led 4k(32inch)</option>
                <option value="MOBILE1">IQZ10X</option>
                <option value="MOBILE2">V200 NEO</option>
                <option value="DESKTOP">ASUS DESKTOP</option>
            </select>
            <br><br>
            <label for="" align="center">Special request:</label><br>
            <textarea  type="text" rows="5" cols="40"></textarea>
            <br><br>
            <button>Pay registartion amount</button>
            <input type="submit" value="Register now">
            <input type="reset" value="Reset">
            </fieldset>
        </form>
    </body>
</html>
